<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>ProBiz Consultancy Services | Qatar Business Setup, PRO & Healthcare Solutions</title>
    <meta name="title" content="ProBiz Consultancy Services | Qatar Business Setup, PRO & Healthcare Solutions" />
    <meta name="description" content="Different Experts. One Team. All Solutions Under One Roof. Your trusted partner for Business Setup, PRO Services, Healthcare Licensing (MOPH/DHP), Recruitment, and Branding in Doha, Qatar." />
    <meta name="keywords" content="Business Setup Qatar, Company Formation Doha, PRO Services Qatar, MOPH Licensing, DHP Prometric Dataflow, Qatar Commercial Registration, Translation Services Doha, ProBiz Consultancy Services" />
    <meta name="author" content="ProBiz Consultancy Services" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/probiz-logo.png" />
    <link rel="apple-touch-icon" href="/probiz-logo.png" />

    <!-- Google Fonts: Lora & Merriweather -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">

    <!-- Opening Screen (Preloader) Styles -->
    <style>
      #probiz-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        background-color: #070A10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s;
      }
      #probiz-preloader.fade-out {
        opacity: 0;
        transform: scale(1.02);
        filter: blur(4px);
        visibility: hidden;
        pointer-events: none;
      }
      .probiz-preloader-glow {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(201, 168, 76, 0.12) 0%, rgba(201, 168, 76, 0.02) 45%, transparent 70%);
        pointer-events: none;
        animation: probizPulseGlow 3s ease-in-out infinite alternate;
      }
      .probiz-preloader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
        padding: 2rem;
        text-align: center;
      }
      .probiz-preloader-logo {
        width: 195px;
        max-width: 70vw;
        height: auto;
        display: block;
        margin-bottom: 1.5rem;
        filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 20px rgba(201, 168, 76, 0.16));
        animation: probizLogoEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .probiz-preloader-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        animation: probizFadeIn 0.8s 0.25s ease-out backwards;
      }
      .probiz-preloader-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2.5px solid rgba(201, 168, 76, 0.18);
        border-top-color: #F5D061;
        border-right-color: #C9A84C;
        animation: probizSpinnerRound 0.85s linear infinite;
        box-shadow: 0 0 12px rgba(201, 168, 76, 0.25);
      }
      .probiz-preloader-subtext {
        font-family: 'Lora', serif;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(201, 168, 76, 0.8);
        margin-top: 4px;
      }
      @keyframes probizSpinnerRound {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes probizLogoEnter {
        0% { opacity: 0; transform: translateY(12px) scale(0.96); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes probizFadeIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes probizPulseGlow {
        0% { opacity: 0.6; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>
  <body class="bg-[#080B11] text-slate-100 antialiased selection:bg-[#C5A059] selection:text-black">
    <!-- Opening Time Loading Screen with Centered Logo and Small Rounding Icon -->
    <div id="probiz-preloader" role="status" aria-label="Loading ProBiz Website">
      <div class="probiz-preloader-glow"></div>
      <div class="probiz-preloader-content">
        <img src="/probiz-logo.png" alt="ProBiz Consultancy Services" class="probiz-preloader-logo" />
        <div class="probiz-preloader-loader">
          <div class="probiz-preloader-spinner"></div>
          <span class="probiz-preloader-subtext">Loading Excellence</span>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <!-- Preloader Dismiss Script -->
    <script>
      (function() {
        var startTime = Date.now();
        var minDisplayMs = 1200;
        var dismissed = false;

        function dismissPreloader() {
          if (dismissed) return;
          var loader = document.getElementById('probiz-preloader');
          if (!loader) {
            dismissed = true;
            return;
          }
          var elapsed = Date.now() - startTime;
          var delay = Math.max(0, minDisplayMs - elapsed);

          setTimeout(function() {
            if (loader) {
              loader.classList.add('fade-out');
              setTimeout(function() {
                if (loader && loader.parentNode) {
                  loader.parentNode.removeChild(loader);
                }
                dismissed = true;
              }, 700);
            }
          }, delay);
        }

        if (document.readyState === 'complete') {
          dismissPreloader();
        } else {
          window.addEventListener('load', dismissPreloader);
          // Safety timeout in case resources stall
          setTimeout(dismissPreloader, 3500);
        }

        window.__probizDismissPreloader = dismissPreloader;
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
